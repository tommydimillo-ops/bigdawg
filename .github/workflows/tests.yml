name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    # Was 15 -- raised after a real, evidenced timeout: commit a051e1b's
    # run was cancelled at exactly 15:17 elapsed with code byte-identical
    # to the immediately prior commit (5b05dba), which had passed in
    # 129s. Local runs are consistently ~55-60s on a quiet machine (one
    # local outlier this same session hit 805s under heavy concurrent
    # local load). Since the code was identical between the fast and the
    # timed-out CI run, this isn't a regression in what's being tested --
    # it's this suite's real subprocess/multiprocessing load (git
    # subprocesses, multiprocessing.Process barrier tests, nested
    # test-suite subprocess spawns) occasionally running much slower on a
    # shared CI runner than on a quiet local machine. 30 gives real
    # margin over the evidenced worst case without removing the timeout
    # as a real safety net.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Placeholders only -- never real credentials. agent/chat.py
      # constructs the Anthropic/OpenAI SDK clients at import time, and
      # the OpenAI SDK raises immediately if no key is present at all.
      # No test in this suite makes a real network call through either
      # client -- tests/_safety.py's socket-level firewall and httpx
      # tripwire are the actual enforcement boundary; these placeholders
      # only satisfy the SDK constructors, they are not what makes CI
      # safe.
      ANTHROPIC_API_KEY: "sk-ci-placeholder-not-a-real-key"
      OPENAI_API_KEY: "sk-ci-placeholder-not-a-real-key"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -r requirements.txt
      # -t . is load-bearing, not cosmetic -- it makes discover import
      # every test as tests.test_x (not a bare top-level module), which
      # is what triggers tests/__init__.py's safety bootstrap before any
      # test module runs. See tests/__init__.py for the full explanation.
      - run: python -m unittest discover -s tests -t . -v
